<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">用户和 Agent 使用同一组 Markdown 文件</title>
  <desc id="desc">用户通过桌面应用读写 Markdown 文件，Agent 通过 Skill 读写同一组文件。</desc>

  <rect width="1200" height="220" fill="#faf9f5"/>

  <g id="connections" fill="none" stroke="#8a96a3" stroke-width="1.6" stroke-linecap="round">
    <path d="M132 126H466"/>
    <path d="M734 126H1068"/>
  </g>

  <g id="path-labels" fill="#111920" stroke="#111920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="desktop-app" transform="translate(235 72)">
      <rect x="0.8" y="0.8" width="25.4" height="25.4" rx="6.5" fill="none" stroke-width="1.6"/>
      <text x="4.5" y="20" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="700">Bi</text>
      <text x="40" y="26" stroke="none" font-size="25" font-weight="650">桌面应用</text>
    </g>

    <g id="skill" transform="translate(836 72)">
      <g transform="scale(1.15)" fill="none" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594Z"/>
        <path d="M20 2v4M22 4h-4"/>
        <circle cx="4" cy="20" r="2"/>
      </g>
      <text x="40" y="26" stroke="none" font-size="25" font-weight="650">Skill</text>
    </g>
  </g>

  <g id="nodes" fill="#111920" stroke="#111920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="user">
      <g transform="translate(78 92) scale(1.85)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="5"/>
        <path d="M20 21a8 8 0 0 0-16 0"/>
      </g>
      <text x="100" y="184" stroke="none" font-size="25" font-weight="650" text-anchor="middle">用户</text>
    </g>

    <g id="markdown">
      <rect x="466" y="82" width="268" height="88" rx="10" fill="#e1e8ec" stroke="none"/>
      <g transform="translate(495 102) scale(1.7)" fill="none" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2Z"/>
        <path d="M14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8"/>
      </g>
      <text x="548" y="134" stroke="none" font-size="23" font-weight="650">Markdown 文件</text>
    </g>

    <g id="agent">
      <g transform="translate(1078 92) scale(1.85)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8"/>
        <rect width="16" height="12" x="4" y="8" rx="2"/>
        <path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>
      </g>
      <text x="1100" y="184" stroke="none" font-size="25" font-weight="650" text-anchor="middle">Agent</text>
    </g>
  </g>
</svg>
